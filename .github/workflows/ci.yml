name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental builds don't help a fresh checkout and take gigabytes of disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # What Tauri needs on Linux (WebKitGTK and friends).
  LINUX_DEPS: libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file

jobs:
  core:
    name: Core and sync (fmt, clippy, tests against a real server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The integration tests start a RustCloud server built from its main branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RustCloud/server
          path: server

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            server -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p rc-core -p rc-sync --all-targets --features rc-core/testing --locked -- -D warnings

      - name: Build the server
        working-directory: server
        run: cargo build -p rustcloud-server --locked

      # Failures also become annotations, readable on the run's page at a glance.
      - name: Test
        run: |
          set +e
          cargo test -p rc-core -p rc-sync --features rc-core/testing --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A25 'panicked at|^error' test.log | head -50 | sed 's/^/::error title=Test::/'
          fi
          exit "$status"
        env:
          RC_TEST_SERVER: ${{ github.workspace }}/server/target/debug/rustcloud

  app:
    name: App (svelte-check, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The Rust side embeds app/dist, so the UI is built first.
      - name: UI
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Clippy
        run: cargo clippy -p rustcloud-client --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p rustcloud-client --locked

  windows:
    name: Windows (clippy, tests)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: UI
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The sync engine on NTFS: paths, renames over open files, times.
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A25 'panicked at|^error' test.log | head -80 | sed 's/^/::error title=Test::/'
          fi
          exit "$status"

  android:
    name: Android (clippy for aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android

      - name: UI
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # C parts (SQLite, ring) are compiled with the NDK's clang.
      - name: Clippy
        run: |
          bin=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang
          set +e
          cargo clippy -p rustcloud-client --target aarch64-linux-android --locked -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The log needs a login; an annotation shows on the run's page.
            msg=$(grep -E -A8 '^(error|warning)' clippy.log | head -60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Android clippy::$msg"
          fi
          exit $status
