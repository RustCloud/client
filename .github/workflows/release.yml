name: Release

# A v* tag (v0.1.0, v0.2.0-beta.1) builds the app for every platform in the
# matrix and publishes a GitHub release with the packages and SHA256SUMS; a tag
# with "-" is a pre-release. The tag must match the version in Cargo.toml.
# Started by hand (Actions → Release → Run workflow), it only builds: the
# packages are in the run's artifacts.
#
# A platform is one entry in the matrix: it builds with the Tauri CLI and puts
# its files into out/; the release job picks up whatever the entries produced.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage

          # Next platforms — uncomment when they are ready:
          #
          # - name: windows-x86_64
          #   os: windows-2025
          #   bundles: nsis,msi
          #   files: |
          #     target/release/bundle/nsis/*.exe
          #     target/release/bundle/msi/*.msi
          #
          # - name: android
          #   os: ubuntu-24.04
          #   android: true   # Java + Android SDK/NDK; `tauri android build --apk --aab`,
          #                   # signed with a keystore from repository secrets
          #   files: |
          #     app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          #     app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}

      - name: Build
        working-directory: app
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Collect the packages
        shell: bash
        run: |
          mkdir out
          while IFS= read -r pattern; do
            if [ -n "$pattern" ]; then cp -v $pattern out/; fi
          done <<< "${{ matrix.files }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "RustCloud $GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*
