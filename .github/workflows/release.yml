name: Release

# A v* tag (v0.1.0, v0.2.0-beta.1) builds the app for every platform in the
# matrix and publishes a GitHub release with the packages and SHA256SUMS; a tag
# with "-" is a pre-release. The tag must match the version in Cargo.toml.
# Started by hand (Actions → Release → Run workflow) or by a push to the
# release-check branch, it only builds: the packages are in the run's artifacts.
#
# Android packages are signed with the key from the repository secrets
# ANDROID_KEYSTORE (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS. Without them a throwaway key is made for the run: the APK
# installs, but cannot update one signed by another key.
#
# A platform is one entry in the matrix: it builds with the Tauri CLI and puts
# its files into out/; the release job picks up whatever the entries produced.

on:
  push:
    tags: ["v*"]
    branches: [release-check]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
            # The bare executable as well, in rustcloud-client-<version>-<name>.tar.gz
            # (.zip on Windows).
            archive: rustcloud-client

          - name: windows-x86_64
            os: windows-2025
            bundles: nsis,msi
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
            archive: rustcloud-client.exe

          # One APK for phones (arm64, arm) and emulators (x86_64).
          - name: android
            os: ubuntu-24.04
            android: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.android && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}

      - name: Build
        if: ${{ !matrix.android }}
        working-directory: app
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      # The Gradle project (src-tauri/gen/android) is generated here, not kept in git.
      - name: Build (Android)
        if: matrix.android
        working-directory: app
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          npm ci --no-audit --no-fund
          npm run tauri android init -- --ci
          res=src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/. "$res/"
          # Synced folders live in the shared storage: "access to all files".
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application#' "$manifest"
          grep -q MANAGE_EXTERNAL_STORAGE "$manifest"
          # Ours: keeps the page clear of the status bar, navigation bar and keyboard.
          activity=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt)
          test -n "$activity"
          cp src-tauri/android/MainActivity.kt "$activity"
          npm run tauri android build -- --ci --apk --target aarch64 armv7 x86_64

      - name: Sign the APK
        if: matrix.android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          tools=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signed with a throwaway key, the APK cannot update an installed one"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=rustcloud
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=RustCloud" >/dev/null
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          unsigned=$(ls app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "out/RustCloud_${version}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "out/RustCloud_${version}_android.apk"
          # The v4 signature file is for incremental installs from a computer (adb), not for users.
          rm -f "$RUNNER_TEMP/release.jks" out/*.idsig

      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p out
          while IFS= read -r pattern; do
            if [ -n "$pattern" ]; then cp -v $pattern out/; fi
          done <<< "${{ matrix.files }}"

      - name: Archive the executable
        if: matrix.archive
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          dir="rustcloud-client-$version-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.archive }}" README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "out/$dir.zip" "$dir" >/dev/null
          else
            strip "$dir/${{ matrix.archive }}"
            tar czf "out/$dir.tar.gz" "$dir"
          fi
          ls -l out/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "RustCloud $GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*
