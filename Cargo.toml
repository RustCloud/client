[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace.dependencies]
rc-core = { path = "crates/core" }
rc-sync = { path = "crates/sync" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
# Both root stores: public CAs, and the system's own (self-hosted servers often use a home CA).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
url = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
tracing = "0.1"
tempfile = "3"
