[package]
name = "rustcloud-client"
description = "RustCloud client: files on the server, synced folders, plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library as well: Android loads the app as a shared library.
[lib]
name = "rustcloud_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rc-core.workspace = true
rc-sync.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify = "8.2"
# Paths without the `\\?\` prefix on Windows.
dunce = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
tracing.workspace = true

# Desktops only: start at login, and one copy of the app at a time (two would
# sync the same folders at once).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
chrono.workspace = true
