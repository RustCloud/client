[package]
name = "rustcloud-client"
description = "RustCloud client: files on the server, synced folders, plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library as well: Android loads the app as a shared library.
[lib]
name = "rustcloud_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rc-core.workspace = true
rc-sync.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify = "8.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
